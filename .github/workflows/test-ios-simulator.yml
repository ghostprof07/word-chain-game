name: iOS Simulator Testi (ekran goruntusu)

# Cihaz OLMADAN iOS doğrulaması: uygulamayı iPhone simülatöründe açar,
# ekran görüntüsü alır ve çökme olup olmadığını raporlar.
#
# Neyi doğrular: uygulama iOS'ta açılıyor mu, arayüz render ediliyor mu,
# Python import'ları çalışıyor mu, sunucuya bağlanabiliyor mu.
# Neyi doğrulamaz: gerçek cihaz performansı, imzalama/App Store süreci.
#
# NOT: Simülatör AYRI bir mimari (arm64-simulator) — cihaz derlemesinin
# önbelleğini kullanamaz, kendi tam derlemesini yapar (ilk sefer uzun).
on:
  workflow_dispatch:

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sistem bağımlılıkları (autotools)
        run: brew install autoconf automake libtool pkg-config

      - name: kivy-ios kur
        run: |
          python -m pip install --upgrade pip
          pip install kivy-ios "cython<3.1"

      - name: Simülatör derleme önbelleği
        uses: actions/cache@v4
        with:
          path: |
            dist
            .cache
          key: kivy-ios-sim-v2-${{ runner.os }}
          # Cihaz derlemesinin önbelleğinden sıcak başlangıç (hostpython gibi
          # platformdan bağımsız parçalar yeniden derlenmesin)
          restore-keys: |
            kivy-ios-dist-v1-${{ runner.os }}

      # Simülatör ayrı bir platform: cihaz "iphoneos", simülatör
      # "iphonesimulator" SDK'sına karşı derlenir. (toolchain'in bayrağı
      # --arch DEĞİL --platform; yanlışı CI yakaladı.)
      # Geçerli platform adları "{sdk}-{mimari}" biçiminde:
      #   iphoneos-arm64 | iphonesimulator-arm64 | iphonesimulator-x86_64
      # macos-15 runner'ları Apple Silicon → simülatör de arm64.
      - name: Kivy'yi simülatör için derle
        run: toolchain build kivy --platform iphonesimulator-arm64

      - name: Python paketlerini kur
        run: |
          toolchain pip install --no-binary :all: certifi idna urllib3 charset-normalizer requests websocket-client

      - name: Xcode projesi oluştur
        run: toolchain create Lexicoil client

      - name: Uygulama varlıklarını yerleştir
        run: |
          set -e
          PROJ=lexicoil-ios
          ICONSET=$(find $PROJ -type d -name 'AppIcon.appiconset' | head -1)
          if [ -n "$ICONSET" ]; then
            rm -rf "$ICONSET"/* && cp ios/AppIcon.appiconset/* "$ICONSET"/
          fi
          # kivy-ios plist'i ön ekli adlandırıyor (lexicoil-Info.plist)
          PLIST=$(find $PROJ -name '*Info.plist' -not -path '*/build/*' | head -1)
          echo "Info.plist: $PLIST"
          PB=/usr/libexec/PlistBuddy
          $PB -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          $PB -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          $PB -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"

      # ARCHS=arm64 ŞART: kivy-ios kütüphaneleri arm64 simülatör için derlendi,
      # ama Xcode varsayılanı x86_64'ü de denediğinden "fat file missing arch
      # x86_64 / Undefined symbols for architecture x86_64" ile kırılıyordu.
      - name: Simülatör için derle
        run: |
          xcodebuild -project lexicoil-ios/lexicoil.xcodeproj \
            -scheme lexicoil -configuration Debug \
            -sdk iphonesimulator -derivedDataPath dd \
            ARCHS=arm64 VALID_ARCHS=arm64 EXCLUDED_ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO \
            build

      - name: Simülatörü başlat ve uygulamayı çalıştır
        run: |
          set -e
          APP=$(find dd -name '*.app' -type d -path '*iphonesimulator*' | head -1)
          echo "App: $APP"
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          echo "Bundle id: $BUNDLE"

          UDID=$(xcrun simctl create LexicoilTest \
                 "iPhone 16" 2>/dev/null || \
                 xcrun simctl list devices available | grep -m1 -o '[0-9A-F-]\{36\}')
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          xcrun simctl install "$UDID" "$APP"

          # Uygulamanın kendi çıktısını yakala (Python hataları buradan görünür).
          # NOT: 'launch --console-pty' arka plana atılıp yönlendirilince pty
          # bulamayıp sessizce ölüyor ve uygulama hiç başlamıyordu — bu yüzden
          # log akışı AYRI bir süreçte, launch ise ÖN PLANDA çalıştırılıyor.
          xcrun simctl spawn "$UDID" log stream --level debug \
            --predicate 'senderImagePath CONTAINS "lexicoil" OR process == "lexicoil"' \
            > launch.log 2>&1 &
          LOG_PID=$!
          sleep 3

          echo "--- simctl launch ---"
          set +e
          xcrun simctl launch "$UDID" "$BUNDLE"
          LAUNCH_RC=$?
          set -e
          echo "launch cikis kodu: $LAUNCH_RC"

          # Kivy'nin açılması + presplash + ilk ekran için zaman tanı
          sleep 40
          xcrun simctl io "$UDID" screenshot acilis.png
          sleep 25
          xcrun simctl io "$UDID" screenshot ikinci.png
          kill $LOG_PID 2>/dev/null || true

          echo "--- Uygulama ciktisi (son 120 satir) ---"
          tail -120 launch.log || true

          # Uygulama hâlâ ayakta mı?
          if xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -q "$BUNDLE"; then
            echo "SONUC: uygulama AYAKTA"
          else
            echo "SONUC: uygulama AYAKTA DEGIL"
          fi

          # Çökme raporlarını TAM olarak dök (hem host hem simülatör yolu)
          echo "--- COKME RAPORLARI ---"
          for D in "$HOME/Library/Logs/DiagnosticReports" \
                   "$HOME/Library/Developer/CoreSimulator/Devices/$UDID/data/Library/Logs/DiagnosticReports"; do
            find "$D" -name '*exicoil*' 2>/dev/null | while read -r C; do
              echo "### $C"; cat "$C"
            done
          done
          echo "(rapor yoksa yukarisi bostur)"

      - name: Ekran görüntülerini ve logu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-sonuc
          path: |
            acilis.png
            ikinci.png
            launch.log
