name: iOS IPA Derle (imzasiz)

# iOS derlemesi yalnızca macOS'ta yapılabilir → GitHub'ın macOS runner'ı.
# Çıktı İMZASIZ .ipa — App Store'a gitmez ama Sideloadly/AltStore ile
# (ücretsiz Apple ID, 7 günlük sertifika) telefona kurulabilir.
# Derleme uzun (~60-90 dk ilk sefer) olduğu için sadece elle tetiklenir.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sistem bağımlılıkları (autotools)
        run: brew install autoconf automake libtool pkg-config

      - name: kivy-ios kur
        run: |
          python -m pip install --upgrade pip
          # cython'u kivy-ios kurmuyor ama kivy derlemesi için zorunlu
          # (kivy 2.3.x cython 3.0.x ile derleniyor, 3.1 henüz desteklenmiyor)
          pip install kivy-ios "cython<3.1"

      # dist/ (derlenen kütüphaneler + state.db) ve .cache (indirmeler)
      # saklanınca sonraki derlemeler dakikalara iner. Anahtar bozulursa
      # (örn. kivy-ios sürüm atlaması) v2 yapıp temiz derleme al.
      - name: Derleme önbelleği
        uses: actions/cache@v4
        with:
          path: |
            dist
            .cache
          key: kivy-ios-dist-v1-${{ runner.os }}

      # kivy hedefi bağımlılık zincirini de derler:
      # hostpython3, libffi, openssl (wss için şart), python3, sdl2 ailesi.
      - name: Kivy + Python'u iOS için derle
        run: toolchain build kivy

      # Saf-Python bağımlılıklar. --no-binary ŞART: pip aksi halde macOS
      # wheel'i (derlenmiş .so içeren, örn. charset-normalizer) indirebilir,
      # o da iPhone'da import hatası verir.
      - name: Python paketlerini kur
        run: |
          toolchain pip install --no-binary :all: certifi idna urllib3 charset-normalizer requests websocket-client

      # client/ içeriği (main.py, words_*.txt, sounds/) uygulama paketine
      # aynen kopyalanır → lexicoil-ios/lexicoil.xcodeproj oluşur.
      - name: Xcode projesi oluştur
        run: toolchain create Lexicoil client

      # kivy-ios'un ürettiği proje jenerik ikon + varsayılan Info.plist ile
      # gelir. Burada marka ikonunu, portre kilidini, sürümü, ihracat-uyumu
      # bayrağını ve Apple'ın gizlilik manifestosunu yerleştiriyoruz.
      - name: Uygulama varlıklarını ve Info.plist'i yerleştir
        run: |
          set -e
          PROJ=lexicoil-ios
          echo "--- Proje içeriği ---"
          ls -la $PROJ

          # 1) İKON — mevcut asset katalogundaki AppIcon.appiconset'i değiştir
          ICONSET=$(find $PROJ -type d -name 'AppIcon.appiconset' | head -1)
          if [ -n "$ICONSET" ]; then
            echo "Asset katalogu bulundu: $ICONSET"
            rm -rf "$ICONSET"/*
            cp ios/AppIcon.appiconset/* "$ICONSET"/
            ls "$ICONSET" | head -5
          else
            echo "UYARI: AppIcon.appiconset bulunamadi — ikon atlandi."
          fi

          # 2) INFO.PLIST
          # DİKKAT: kivy-ios plist'i ön ekli adlandırıyor (lexicoil-Info.plist),
          # bu yüzden '*Info.plist' ile aranmalı — tam 'Info.plist' araması
          # boş dönüyor ve tüm plist ayarları sessizce atlanıyordu.
          PLIST=$(find $PROJ -name '*Info.plist' -not -path '*/build/*' | head -1)
          echo "Info.plist: $PLIST"
          if [ -z "$PLIST" ] || [ ! -f "$PLIST" ]; then
            echo "HATA: Info.plist bulunamadi. Proje agaci:"
            find $PROJ -maxdepth 3 -name '*.plist'
            exit 1
          fi
          PB=/usr/libexec/PlistBuddy
          ayarla() {  # anahtar tip deger  (varsa Set, yoksa Add)
            $PB -c "Set :$1 $3" "$PLIST" 2>/dev/null || \
            $PB -c "Add :$1 $2 $3" "$PLIST"
          }
          # Sürüm tek kaynaktan: buildozer.spec (Android ile aynı kalsın)
          SURUM=$(grep -E '^version\s*=' client/buildozer.spec | head -1 | sed 's/.*=\s*//')
          echo "Sürüm: $SURUM"
          ayarla CFBundleShortVersionString string "$SURUM"
          ayarla CFBundleVersion string "${GITHUB_RUN_NUMBER:-1}"

          # Bundle kimliği — kivy-ios varsayılanı org.kivy.lexicoil bırakılamaz;
          # Android'le aynı kimliği kullanıyoruz.
          ayarla CFBundleIdentifier string com.kemalyavuz.lexicoil

          # Asset katalogundaki ikon setinin adı. Bu anahtar olmadan modern
          # iOS ikonu bulamaz ve App Store doğrulaması uyarı verir.
          ayarla CFBundleIconName string AppIcon

          # Yalnızca https/wss kullanıyoruz; standart şifreleme -> muaf.
          # Bu bayrak olmadan her yüklemede "ihracat uyumu" sorusu sorulur.
          ayarla ITSAppUsesNonExemptEncryption bool false

          # Portre kilidi (oyun arayüzü dikey tasarlandı)
          $PB -c "Delete :UISupportedInterfaceOrientations" "$PLIST" 2>/dev/null || true
          $PB -c "Add :UISupportedInterfaceOrientations array" "$PLIST"
          $PB -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST"
          $PB -c "Delete :UISupportedInterfaceOrientations~ipad" "$PLIST" 2>/dev/null || true

          echo "--- Info.plist son hali ---"
          $PB -c "Print" "$PLIST" | head -40

          # 3) GİZLİLİK MANİFESTOSU
          # Xcode, dosya yollarını .xcodeproj'in bulunduğu klasöre (SOURCE_ROOT)
          # göre çözer. Bu yüzden dosyayı ORAYA koyup ÇIPLAK adla kaydediyoruz;
          # alt klasör adı vermek "Build input file cannot be found" hatası
          # veriyordu. Kayıt tutmazsa derlemeyi kırmıyoruz — manifest yalnızca
          # App Store'a yüklerken gerekli, imzasız IPA'yı etkilemiyor.
          cp ios/PrivacyInfo.xcprivacy "$PROJ"/
          ls -l "$PROJ/PrivacyInfo.xcprivacy"
          if python -m pbxproj file "$PROJ/lexicoil.xcodeproj" \
               "PrivacyInfo.xcprivacy" --target lexicoil ; then
            echo "PrivacyInfo projeye eklendi."
          else
            echo "UYARI: PrivacyInfo projeye EKLENEMEDI — App Store'a yuklemeden once elle eklenmeli."
            rm -f "$PROJ/PrivacyInfo.xcprivacy"
          fi

      - name: İmzasız derle
        run: |
          xcodebuild -project lexicoil-ios/lexicoil.xcodeproj \
            -configuration Release -sdk iphoneos \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build

      - name: IPA paketle
        run: |
          set -e
          APP=$(find lexicoil-ios -name '*.app' -type d -path '*Release-iphoneos*' | head -1)
          echo "Bulunan app: $APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -qr lexicoil-unsigned.ipa Payload
          ls -lh lexicoil-unsigned.ipa

      - name: IPA'yı yükle (indirilebilir çıktı)
        uses: actions/upload-artifact@v4
        with:
          name: lexicoil-ipa
          path: lexicoil-unsigned.ipa
